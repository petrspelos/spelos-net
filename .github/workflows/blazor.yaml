name: Build and deploy Blazor WebAssembly site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'pages' || format('validate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Spelos.Net.slnx
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Build
        run: dotnet build Spelos.Net.slnx --configuration Release --no-restore
      - name: Run component and content tests
        run: dotnet test tests/Spelos.Net.Web.Tests/Spelos.Net.Web.Tests.csproj --configuration Release --no-build
      - name: Install Chromium
        run: pwsh tests/Spelos.Net.Web.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Start site
        run: dotnet run --project src/Spelos.Net.Web/Spelos.Net.Web.csproj --configuration Release --no-build --urls http://127.0.0.1:5080 &
      - name: Wait for site
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5080
      - name: Run browser and accessibility tests
        env:
          SPELOS_BASE_URL: http://127.0.0.1:5080
        run: dotnet test tests/Spelos.Net.Web.BrowserTests/Spelos.Net.Web.BrowserTests.csproj --configuration Release --no-build
      - name: Publish
        run: dotnet publish src/Spelos.Net.Web/Spelos.Net.Web.csproj --configuration Release --no-build
      - name: Report published size
        run: du -sh src/Spelos.Net.Web/bin/Release/net10.0/publish/wwwroot && find src/Spelos.Net.Web/bin/Release/net10.0/publish/wwwroot -type f -printf '%s\n' | awk '{ total += $1 } END { printf "Uncompressed bytes: %d\n", total }'
      - name: Configure Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: src/Spelos.Net.Web/bin/Release/net10.0/publish/wwwroot

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
